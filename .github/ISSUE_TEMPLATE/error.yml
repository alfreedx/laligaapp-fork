name: Error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre
      description: Describe el problema y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a …
        2. Pulsar …
        3. Ver el error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Rentabilidad
        - Mi Alineación
        - Informe diario / PDF
        - Tarea programada / automatización
        - Auto-mercado
        - Avisos de cláusulas
        - Otra (heredada del original)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión / commit
      placeholder: "v1.0.0-fork o hash del commit"
  - type: textarea
    id: registros
    attributes:
      label: Mensajes de error
      description: Texto del error en pantalla o de la consola. **No pegues tokens ni datos personales.**
      render: text
